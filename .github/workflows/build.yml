
name: Build KOS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download KOS source
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Files in KOS repository:"
          ls -la
          echo "Build scripts:"
          find . -maxdepth 4 -type f \
            \( -name 'build.sh' -o -name '*.yml' -o -name '*.yaml' \) \
            -not -path './.git/*'
